name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate v1 boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies from lockfile
        run: corepack pnpm install --frozen-lockfile

      - name: Disable unrelated Google Chrome APT source
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources

      - name: Install Chromium and system dependencies
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Run repository validation
        run: corepack pnpm run ci
